# Installed into .git/hooks by scripts/setup-dev.sh, which also sets up the
# linter these hooks call:
#
#   pre-commit install --hook-type pre-commit --hook-type pre-push
#   pre-commit run --all-files    # run the commit hooks now, across the tree
#
# Commit hooks run in the order listed and stop at the first failure; the
# pre-push hook is the release guard described at the bottom.
repos:
-   repo: local
    hooks:
    # package.json is the source of truth for the version; this repairs
    # manifest.json from it rather than just complaining, so a hand-edit cannot
    # leave the two out of step. A repair shows up as "files were modified",
    # which fails the commit until the fixed manifest.json is staged again.
    # `npm version` already does this through the version lifecycle hook.
    -   id: version-sync
        name: manifest.json version follows package.json
        entry: node scripts/sync-version.js
        language: system
        pass_filenames: false
        files: ^(package|manifest)\.json$
        stages: [pre-commit]

    # Default-profile shellcheck is the CI gate; keep it identical here.
    -   id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: \.sh$
        stages: [pre-commit]

    -   id: filter-engine-tests
        name: filter-engine tests
        entry: npm test --silent
        language: system
        pass_filenames: false
        files: ^(filter-engine\.js|test/.*\.js)$
        stages: [pre-commit]

    # ATN's automated review. The linter is deliberately not pinned: a release
    # goes out only if the linter ATN is running today passes it. See
    # scripts/check-webext.sh for the setup and WEBEXT_LINTER_DIR.
    -   id: webext-linter
        name: webext-linter (ATN automated review)
        entry: scripts/check-webext.sh
        language: script
        pass_filenames: false
        files: \.(js|css|html|json|png)$
        stages: [pre-commit]

    # CI fails a push that changes a packaged file without bumping the version
    # (the release job only fires on a version change, so such a change would
    # never ship). Same check before the push, so the red build never happens.
    -   id: release-bump
        name: packaged changes carry a version bump
        entry: scripts/check-release-bump.sh
        language: script
        pass_filenames: false
        stages: [pre-push]
