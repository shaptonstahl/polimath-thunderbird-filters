name: CI

on:
  push:
  pull_request:

jobs:
  # ── Run tests on every push and every PR ──────────────────────────────────
  test:
    runs-on: ubuntu-26.04
    steps:
      # fetch-depth: 0 so the release tags are present for the packaged-file
      # check below.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Runs before the Node setup — it needs neither Node nor the toolchain.
      # Fails loudly if shellcheck is missing rather than skipping the lint,
      # so a runner image change can't silently drop this gate.
      - name: Lint shell scripts
        run: |
          command -v shellcheck >/dev/null || {
            echo "error: shellcheck not found on runner" >&2
            exit 1
          }
          shellcheck --version
          shellcheck scripts/*.sh scripts/*/*.sh

      # package.json is the single source of truth for the version; manifest.json
      # must stay in sync. Fail loudly so a hand-edit to either file can't drift.
      - name: Check version sync
        run: ./scripts/check-version.sh

      # The release job only acts when the version changed, so a packaged-file
      # change without a bump would land on main and never ship. Fail instead.
      - name: Check packaged changes carry a version bump
        run: ./scripts/check-release-bump.sh

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run tests
        run: npm test

      # The linter ATN's automated review runs (see scripts/check-webext.sh).
      # Cloned rather than installed from npm: the tool is not published there.
      # Deliberately unpinned: a release goes out only if the linter ATN runs
      # today passes it, so tracking upstream main is the point. Its schema
      # cache is re-fetched once a day by design, so CI installs it fresh each
      # run instead of caching.
      - name: Run webext-linter (ATN automated review)
        env:
          WEBEXT_LINTER_DIR: ${{ runner.temp }}/webext-linter
        run: |
          git clone --depth 1 https://github.com/thunderbird/webext-linter.git "$WEBEXT_LINTER_DIR"
          npm ci --prefix "$WEBEXT_LINTER_DIR" --no-audit --no-fund --silent
          ./scripts/check-webext.sh

  # ── Build .xpi and publish a release — main branch only ──────────────────
  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-26.04
    permissions:
      contents: write   # needed to create releases and tags

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Read version from manifest.json
        id: version
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Check if version changed
        id: changed
        run: |
          latest=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName // ""')
          latest="${latest#v}"
          if [ "$latest" = "$CURR" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true"  >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURR: ${{ steps.version.outputs.version }}

      - name: Build .xpi
        if: steps.changed.outputs.changed == 'true'
        run: |
          zip -r "polimath-filters-${{ steps.version.outputs.version }}.xpi" -@ < scripts/xpi-files.txt

      - name: Verify .xpi contains every referenced file
        if: steps.changed.outputs.changed == 'true'
        run: ./scripts/verify-xpi.sh "polimath-filters-${{ steps.version.outputs.version }}.xpi"

      - name: Upload .xpi as workflow artifact
        if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: polimath-filters-${{ steps.version.outputs.version }}
          path: polimath-filters-${{ steps.version.outputs.version }}.xpi

      - name: Check whether this version already has a release
        if: steps.changed.outputs.changed == 'true'
        id: check
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" &>/dev/null; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        if: steps.changed.outputs.changed == 'true' && steps.check.outputs.exists == 'false'
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            "polimath-filters-${{ steps.version.outputs.version }}.xpi"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
