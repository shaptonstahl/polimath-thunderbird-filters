# Hooks installed into .git/hooks by `pre-commit install` (run once per clone;
# scripts/setup-dev.sh does that and the linter setup below).
#
#   pre-commit install            # enable the hooks for this clone
#   pre-commit run --all-files    # run them now, across the whole tree
#
# Hooks run in the order listed, and pre-commit stops at the first failure.
repos:
-   repo: local
    hooks:
    # package.json is the source of truth for the version; this repairs
    # manifest.json from it rather than just complaining, so a hand-edit cannot
    # leave the two out of step. A repair shows up as "files were modified",
    # which fails the commit until the fixed manifest.json is staged again.
    # `npm version` already does this through the version lifecycle hook.
    -   id: version-sync
        name: manifest.json version follows package.json
        entry: node scripts/sync-version.js
        language: system
        pass_filenames: false
        files: ^(package|manifest)\.json$

    # Default-profile shellcheck is the CI gate; keep it identical here.
    -   id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: \.sh$

    -   id: filter-engine-tests
        name: filter-engine tests
        entry: npm test --silent
        language: system
        pass_filenames: false
        files: ^(filter-engine\.js|test/.*\.js)$

    # ATN's automated review. The linter is deliberately not pinned: a release
    # goes out only if the linter ATN is running today passes it. See
    # scripts/check-webext.sh for the setup and WEBEXT_LINTER_DIR.
    -   id: webext-linter
        name: webext-linter (ATN automated review)
        entry: scripts/check-webext.sh
        language: script
        pass_filenames: false
        files: \.(js|css|html|json|png)$
